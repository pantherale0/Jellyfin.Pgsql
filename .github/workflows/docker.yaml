name: '🐋 Build & Publish Docker Image'

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

on:
  push:
    branches:
      - master
  release:
    types:
      - released
  schedule:
    # Check for new Jellyfin versions daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      jellyfin_version:
        description: 'Jellyfin version (leave empty for latest)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jellyfin.pgsql

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      jellyfin_version: ${{ steps.version.outputs.jellyfin_version }}
      should_build: ${{ steps.version.outputs.should_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Jellyfin version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Push builds use the pinned sync-state version; other events use input or latest release.
          if [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ ! -f .github/jellyfin-sync-state.json ]]; then
              echo "Error: .github/jellyfin-sync-state.json not found"
              exit 1
            fi
            JELLYFIN_VERSION=$(jq -r '.jellyfinVersion' .github/jellyfin-sync-state.json)
            if [[ -z "$JELLYFIN_VERSION" || "$JELLYFIN_VERSION" == "null" ]]; then
              echo "Error: jellyfinVersion missing from sync state"
              exit 1
            fi
            echo "Using sync state version from push: $JELLYFIN_VERSION"
          elif [[ -n "${{ github.event.inputs.jellyfin_version }}" ]]; then
            JELLYFIN_VERSION="${{ github.event.inputs.jellyfin_version }}"
            echo "Using manually specified version: $JELLYFIN_VERSION"
          else
            # Fetch latest Jellyfin version from GitHub releases
            JELLYFIN_VERSION=$(gh api repos/jellyfin/jellyfin/releases/latest -q '.tag_name' | sed 's/^v//')
            if [[ -z "$JELLYFIN_VERSION" ]]; then
              echo "Error: Could not fetch latest Jellyfin version"
              exit 1
            fi
            echo "Fetched latest version: $JELLYFIN_VERSION"
          fi

          # Normalize an optional leading 'v'
          JELLYFIN_VERSION="${JELLYFIN_VERSION#v}"

          echo "jellyfin_version=$JELLYFIN_VERSION" >> "$GITHUB_OUTPUT"

          # Check migration sync state against target Jellyfin version
          SYNC_OK="true"
          if [[ -f .github/jellyfin-sync-state.json ]]; then
            STATE_VERSION=$(jq -r '.jellyfinVersion' .github/jellyfin-sync-state.json)
            STATE_CORE=$(jq -r '.lastCoreMigration' .github/jellyfin-sync-state.json)

            LATEST_CORE=$(gh api "repos/jellyfin/jellyfin/contents/src/Jellyfin.Database/Jellyfin.Database.Providers.Sqlite/Migrations?ref=v${JELLYFIN_VERSION}" \
              --paginate \
              -q '.[].name' \
              | grep -E '^[0-9]+_.*\.cs$' \
              | grep -v '\.Designer\.cs$' \
              | sort \
              | tail -n1 \
              | sed 's/\.cs$//')

            if [[ "$STATE_VERSION" != "$JELLYFIN_VERSION" ]]; then
              echo "Migration sync state version ($STATE_VERSION) does not match target ($JELLYFIN_VERSION)"
              SYNC_OK="false"
            elif [[ -n "$LATEST_CORE" && "$LATEST_CORE" != "$STATE_CORE" ]]; then
              echo "Core migration ($LATEST_CORE) is ahead of sync state ($STATE_CORE)"
              SYNC_OK="false"
            fi
          else
            echo "Warning: .github/jellyfin-sync-state.json not found"
            SYNC_OK="false"
          fi

          echo "sync_ok=$SYNC_OK" >> "$GITHUB_OUTPUT"

          # Check if this Jellyfin-version tag already exists in GHCR
          EXISTING_TAGS=$(gh api /users/${{ github.repository_owner }}/packages/container/${{ env.IMAGE_NAME }}/versions \
            --paginate --jq '.[].metadata.container.tags[]?' 2>/dev/null) || EXISTING_TAGS=""

          if echo "$EXISTING_TAGS" | grep -qx "$JELLYFIN_VERSION"; then
            TAG_EXISTS="true"
          else
            TAG_EXISTS="false"
          fi

          # Build rules:
          # - Always build on push, manual dispatch, and release (if sync OK)
          # - On schedule, only build if the version tag does not already exist
          if [[ "$SYNC_OK" != "true" ]]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Migration sync required — waiting for sync PR to merge"
          elif [[ "${{ github.event_name }}" == "push" ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ "${{ github.event_name }}" == "release" ]] || [[ "$TAG_EXISTS" == "false" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            if [[ "${{ github.event_name }}" == "push" ]]; then
              echo "Push to master — rebuilding image for Jellyfin $JELLYFIN_VERSION"
            else
              echo "Will build image for Jellyfin $JELLYFIN_VERSION"
            fi
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Image tag $JELLYFIN_VERSION already exists; skipping scheduled build"
          fi

  build-and-push:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify jellyfin submodule matches sync state
        run: |
          set -euo pipefail
          JELLYFIN_VERSION="${{ needs.check-version.outputs.jellyfin_version }}"
          STATE_VERSION=$(jq -r '.jellyfinVersion' .github/jellyfin-sync-state.json)
          EXPECTED_COMMIT=$(jq -r '.jellyfinSubmoduleCommit' .github/jellyfin-sync-state.json)
          ACTUAL_COMMIT=$(git -C jellyfin rev-parse HEAD)

          if [[ "$STATE_VERSION" != "$JELLYFIN_VERSION" ]]; then
            echo "ERROR: Sync state version ($STATE_VERSION) does not match build target ($JELLYFIN_VERSION)" >&2
            exit 1
          fi

          if [[ "$ACTUAL_COMMIT" != "$EXPECTED_COMMIT" ]]; then
            echo "ERROR: jellyfin submodule commit mismatch." >&2
            echo "  Expected: $EXPECTED_COMMIT" >&2
            echo "  Actual:   $ACTUAL_COMMIT" >&2
            exit 1
          fi

          echo "Submodule verified: v${JELLYFIN_VERSION} @ ${ACTUAL_COMMIT}"

      - name: Set Docker image tag
        id: image-tag
        run: |
          JELLYFIN_VERSION="${{ needs.check-version.outputs.jellyfin_version }}"
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=$JELLYFIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "owner=$OWNER_LC" >> "$GITHUB_OUTPUT"
          echo "Image tag: $JELLYFIN_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            JELLYFIN_VERSION=${{ steps.image-tag.outputs.tag }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image-tag.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.image-tag.outputs.owner }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64